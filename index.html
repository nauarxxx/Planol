<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Planta 3D Mobles</title>
  <meta name="theme-color" content="#b5652f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Planta 3D" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="stylesheet" href="css/style.css?v=16" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/OrbitControls.js": "./vendor/OrbitControls.js" } }
  </script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header class="brand">
        <h1>Planta 3D</h1>
        <span class="sub">Mobles a mida</span>
      </header>
      <nav class="tabs" role="tablist">
        <button data-tab="muebles" class="active">Mobles</button>
        <button data-tab="distribuir">Distribuir</button>
        <button data-tab="plano">Plànol</button>
        <button data-tab="datos">Dades</button>
      </nav>
      <section id="tab-muebles" class="tab active"></section>
      <section id="tab-distribuir" class="tab"></section>
      <section id="tab-plano" class="tab"></section>
      <section id="tab-datos" class="tab"></section>
    </aside>
    <main id="viewport">
      <div id="toolbar">
        <div class="group">
          <button data-view="3d" class="active" title="Vista 3D">3D</button>
          <button data-view="top" title="Vista en planta">Planta</button>
        </div>
        <div class="group">
          <label>Parets
            <select id="wallMode">
              <option value="low" selected>Baixes</option>
              <option value="full">Completes</option>
              <option value="none">Amagades</option>
            </select>
          </label>
        </div>
        <div class="group">
          <label><input type="checkbox" id="labels" checked /> Etiquetes</label>
          <label><input type="checkbox" id="measures" checked /> Cotes</label>
        </div>
        <div class="group" id="account" hidden>
          <span class="who"></span><span id="sync" class="sync"></span>
          <button id="signout" title="Tanca la sessió">Surt</button>
        </div>
        <div class="group">
          <button id="undo" title="Desfés (Ctrl+Z)">↶</button>
          <button id="redo" title="Refés (Ctrl+Y)">↷</button>
        </div>
        <div class="group" id="install-group" hidden>
          <button id="install" title="Instal·la l’app al dispositiu">⬇ Instal·la</button>
        </div>
      </div>
      <div id="canvas-wrap"></div>
      <div id="props" hidden></div>
      <div id="selbar" hidden>
        <button data-act="rl" title="Gira −90°">⟲</button>
        <button data-act="rr" title="Gira +90°">⟳</button>
        <button data-act="dup" title="Duplica">⧉</button>
        <button data-act="del" title="Elimina" class="danger">🗑</button>
        <button data-act="props" title="Detalls del moble">Detalls</button>
      </div>
      <div id="hint">Arrossega un moble per moure’l · R / Maj+R girar · Supr esborrar · Ctrl+D duplicar</div>
    </main>
  </div>
  <div id="install-help" class="modal" hidden>
    <div class="gate-card">
      <h1>Instal·la l’app</h1>
      <div class="modal-body"></div>
      <button class="btn secondary" id="install-close">Tanca</button>
    </div>
  </div>
  <div id="gate" hidden>
    <div class="gate-card">
      <h1>Planta 3D</h1>
      <div class="gate-body"></div>
    </div>
  </div>
  <script type="module" src="js/main.js?v=16"></script>
</body>
</html>
